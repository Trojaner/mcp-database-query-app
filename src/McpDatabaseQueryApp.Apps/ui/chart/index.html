<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCP Database Query App Chart</title>
<style>
:root {
    color-scheme: light dark;
    font-family: var(--font-sans, system-ui, sans-serif);
}
body {
    margin: 0;
    padding: 12px;
    background: var(--color-background-primary, Canvas);
    color: var(--color-text-primary, CanvasText);
    font-family: var(--font-sans, system-ui, sans-serif);
    display: flex;
    flex-direction: column;
    gap: 10px;
}
header {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}
.controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    flex: 1;
}
label {
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--color-text-primary, CanvasText);
}
label.chk { gap: 5px; }
select {
    padding: 4px 6px;
    font-size: 13px;
    border: 1px solid var(--color-border-primary, #8884);
    background: var(--color-background-primary, Field);
    color: var(--color-text-primary, FieldText);
    border-radius: var(--border-radius-sm, 4px);
    font-family: var(--font-sans, system-ui, sans-serif);
}
button {
    padding: 4px 10px;
    font-size: 13px;
    border: 1px solid var(--color-border-primary, #8884);
    background: var(--color-background-secondary, ButtonFace);
    color: var(--color-text-primary, ButtonText);
    border-radius: var(--border-radius-sm, 4px);
    cursor: pointer;
    font-family: var(--font-sans, system-ui, sans-serif);
}
button:hover { filter: brightness(1.1); }
button[hidden], [hidden] { display: none !important; }
.advanced {
    border: 1px solid var(--color-border-primary, #8884);
    border-radius: var(--border-radius-sm, 4px);
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--color-background-secondary, #8881);
}
.section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    opacity: 0.7;
}
.series-panel {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.series-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 12px;
}
.series-row .series-name {
    min-width: 120px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
}
.series-swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    display: inline-block;
    flex: 0 0 auto;
}
.series-row.disabled .series-opts { opacity: 0.4; pointer-events: none; }
.series-opts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.forecast-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    border-top: 1px dashed var(--color-border-secondary, #8883);
    padding-top: 8px;
}
.chart-wrap {
    position: relative;
    flex: 1;
    height: 420px;
    border: 1px solid var(--color-border-primary, #8884);
    border-radius: var(--border-radius-sm, 4px);
    padding: 4px;
}
canvas { width: 100% !important; height: 100% !important; }
.empty {
    padding: 12px;
    opacity: 0.7;
    text-align: center;
    color: var(--color-text-secondary, var(--color-text-primary, CanvasText));
}
</style>
</head>
<body>
<header>
    <div class="controls">
        <label>Chart type <select id="chartType">
            <option value="bar">Bar</option>
            <option value="line">Line</option>
            <option value="area">Area</option>
            <option value="scatter">Scatter</option>
            <option value="timeseries">Time series</option>
            <option value="combo">Combo (bar + line)</option>
            <option value="pie">Pie</option>
            <option value="doughnut">Doughnut</option>
        </select></label>
        <label>X axis <select id="xAxis"></select></label>
        <label class="chk" id="stackedWrap"><input type="checkbox" id="stacked" /> Stacked</label>
        <button id="toggle-advanced" type="button" aria-expanded="false">Series &amp; axes ▾</button>
    </div>
    <button id="toggle-display" type="button" hidden>Maximize</button>
</header>
<div id="advanced" class="advanced" hidden>
    <div class="section-title">Series</div>
    <div id="seriesPanel" class="series-panel"></div>
    <div class="forecast-row">
        <label>Forecast flag <select id="forecastCol"><option value="">(none)</option></select></label>
        <label>Band lower <select id="lowerCol"><option value="">(none)</option></select></label>
        <label>Band upper <select id="upperCol"><option value="">(none)</option></select></label>
    </div>
</div>
<div class="chart-wrap">
    <canvas id="chart"></canvas>
</div>
<div id="empty" class="empty" hidden>No data to chart.</div>
<noscript>
    <p>This view requires JavaScript. The results are also available in the tool's text output.</p>
</noscript>
<!-- INLINE_SCRIPT -->
</body>
</html>
